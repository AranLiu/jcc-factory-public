name: Bug 报告
description: 报告可复现的功能或运行问题
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: 感谢反馈。请先移除日志、截图和配置中的密钥、Cookie、用户数据与内部地址。
  - type: input
    id: version
    attributes:
      label: 版本或提交
      description: 例如 v2.1.0 或提交 SHA
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: 运行方式
      options:
        - Docker Compose
        - 主机开发环境
        - 其他
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: 问题描述
      description: 说明实际结果与预期结果。
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      placeholder: |
        1. 打开……
        2. 执行……
        3. 出现……
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: 已脱敏的日志或截图
      description: 不要粘贴 API key、密码、Cookie、用户文件或可复用攻击载荷。
    validations:
      required: false
  - type: checkboxes
    id: checks
    attributes:
      label: 提交前确认
      options:
        - label: 我已搜索现有 Issue，未发现相同问题。
          required: true
        - label: 我已确认提交内容不含凭据、个人数据或内部系统信息。
          required: true
        - label: 这不是安全漏洞；安全问题将通过私密渠道报告。
          required: true
