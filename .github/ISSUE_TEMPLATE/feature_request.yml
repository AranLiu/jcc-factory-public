name: 功能建议
description: 提议新的用户能力或工作流改进
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: scenario
    attributes:
      label: 使用场景
      description: 谁在什么情况下遇到了什么问题？
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述期望的产品行为，而不只是技术实现。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 已考虑的替代方案
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 范围确认
      options:
        - label: 我已搜索现有 Issue，未发现相同建议。
          required: true
        - label: 建议符合短剧拆解与剧本工作台的当前产品范围。
          required: true
